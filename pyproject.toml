[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stingxss"
version = "0.1.0"
description = "Context-aware reflected & DOM XSS scanner with WAF detection and evasion"
readme = "README.md"
license = { text = "AGPL3" }
requires-python = ">=3.10"
authors = [
  { name = "CommonHuman-Lab" },
]
keywords = ["xss", "security", "scanner", "pentest", "bugbounty"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: AGPL3 License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.28.0",
  "urllib3>=1.26.0",
]

[project.scripts]
stingxss = "stingxss.__main__:main"

[project.urls]
Homepage = "https://github.com/commonhuman-lab/stingxss"
Issues   = "https://github.com/commonhuman-lab/stingxss/issues"

[tool.hatch.build.targets.wheel]
packages = ["stingxss"]
